spring.application.name=analyzer
spring.datasource.url=${ANALYZER_DATABASE_CONNECTION}
spring.datasource.username=${ANALYZER_DATABASE_USER}
spring.datasource.password=${ANALYZER_DATABASE_PASSWORD}
server.port=${ANALYZER_SERVER_PORT}
server.forward-headers-strategy=framework
discord.bot.token=${ANALYZER_DISCORD_TOKEN}
analyzer.frontend.url=${ANALYZER_FRONTEND_URL:http://localhost:4200}

# Discord OAuth (login no site)
spring.security.oauth2.client.registration.discord.client-id=${ANALYZER_DISCORD_CLIENT_ID:}
spring.security.oauth2.client.registration.discord.client-secret=${ANALYZER_DISCORD_CLIENT_SECRET:}
spring.security.oauth2.client.registration.discord.client-name=Discord
spring.security.oauth2.client.registration.discord.scope=identify
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.discord.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.com/api/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=https://discord.com/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.com/api/users/@me
spring.security.oauth2.client.provider.discord.user-name-attribute=id

# Cookie da sessão — em dev usa default de host, em prod sobrescreve via env vars
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${ANALYZER_COOKIE_SECURE:false}
server.servlet.session.cookie.domain=${ANALYZER_COOKIE_DOMAIN:}

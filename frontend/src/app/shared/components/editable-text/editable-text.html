@if (editing()) {
  <div class="flex items-start gap-2">
    @if (multiline()) {
      <textarea
        #field
        rows="3"
        [value]="draft()"
        (input)="onDraftChange($event)"
        (keydown)="onKeyDown($event)"
        [placeholder]="placeholder()"
        [class]="
          'flex-1 rounded-md border border-[color:var(--color-accent)] bg-[color:var(--color-bg)] px-3 py-2 text-sm outline-none ' +
          inputClass()
        "
      ></textarea>
    } @else {
      <input
        #field
        type="text"
        [value]="draft()"
        (input)="onDraftChange($event)"
        (keydown)="onKeyDown($event)"
        [placeholder]="placeholder()"
        [class]="
          'flex-1 rounded-md border border-[color:var(--color-accent)] bg-[color:var(--color-bg)] px-3 py-1.5 outline-none ' +
          inputClass()
        "
      />
    }
    <div class="flex shrink-0 items-center gap-1">
      <button
        type="button"
        (click)="commit()"
        title="Save"
        class="rounded-md bg-[color:var(--color-accent)] px-2.5 py-1 text-xs font-semibold text-black transition hover:opacity-90"
      >
        Save
      </button>
      <button
        type="button"
        (click)="cancel()"
        title="Cancel"
        class="rounded-md border border-[color:var(--color-border-strong)] px-2.5 py-1 text-xs text-[color:var(--color-text-secondary)] transition hover:border-[color:var(--color-loss)] hover:text-[color:var(--color-loss)]"
      >
        Cancel
      </button>
    </div>
  </div>
  @if (multiline()) {
    <p class="mt-1 text-[10px] text-[color:var(--color-text-muted)]">
      Ctrl+Enter para salvar, Esc para cancelar.
    </p>
  }
} @else {
  <button
    type="button"
    (click)="startEdit()"
    class="group flex w-full items-center gap-2 rounded-md text-left transition"
    [class.text-[color:var(--color-text-muted)]]="!hasValue()"
  >
    @if (hasValue()) {
      <span [class]="displayClass()">{{ value() }}</span>
    } @else {
      <span class="text-sm italic">{{ placeholder() }}</span>
    }
    <svg
      viewBox="0 0 16 16"
      class="h-3.5 w-3.5 shrink-0 opacity-0 transition group-hover:opacity-60"
      fill="none"
      stroke="currentColor"
      stroke-width="1.75"
    >
      <path d="M12 2l2 2-8 8H4v-2l8-8z" />
    </svg>
  </button>
}

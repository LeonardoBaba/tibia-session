<form
  [formGroup]="form"
  (ngSubmit)="onApply()"
  class="rounded-xl border border-[color:var(--color-border)] bg-[color:var(--color-surface)] p-4"
>
  <div class="flex flex-wrap items-end gap-4">
    <label class="flex min-w-[180px] flex-1 flex-col gap-1.5">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-[color:var(--color-text-muted)]">
        Search hunt name
      </span>
      <div class="relative">
        <svg viewBox="0 0 16 16" class="absolute left-2.5 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-[color:var(--color-accent)]" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="7" cy="7" r="4.5" />
          <path d="M10.5 10.5L14 14" />
        </svg>
        <input
          type="text"
          formControlName="name"
          placeholder="e.g. Cobras, Asuras..."
          class="w-full rounded-md border border-[color:var(--color-border)] bg-[color:var(--color-bg)] py-2 pl-8 pr-3 text-sm outline-none transition focus:border-[color:var(--color-accent)]"
        />
      </div>
    </label>

    <label class="flex min-w-[180px] flex-1 flex-col gap-1.5">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-[color:var(--color-text-muted)]">
        Search player name
      </span>
      <div class="relative">
        <svg viewBox="0 0 16 16" class="absolute left-2.5 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-[color:var(--color-accent)]" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="7" cy="7" r="4.5" />
          <path d="M10.5 10.5L14 14" />
        </svg>
        <input
          type="text"
          formControlName="player"
          placeholder="e.g. Hikeppo"
          class="w-full rounded-md border border-[color:var(--color-border)] bg-[color:var(--color-bg)] py-2 pl-8 pr-3 text-sm outline-none transition focus:border-[color:var(--color-accent)]"
        />
      </div>
    </label>

    <div class="flex flex-col gap-1.5">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-[color:var(--color-text-muted)]">
        Date range
      </span>
      <div class="flex items-center gap-2">
        <input
          type="date"
          formControlName="startDate"
          class="rounded-md border border-[color:var(--color-border)] bg-[color:var(--color-bg)] px-3 py-2 text-sm outline-none transition focus:border-[color:var(--color-accent)]"
        />
        <span class="text-[color:var(--color-text-muted)]">–</span>
        <input
          type="date"
          formControlName="endDate"
          class="rounded-md border border-[color:var(--color-border)] bg-[color:var(--color-bg)] px-3 py-2 text-sm outline-none transition focus:border-[color:var(--color-accent)]"
        />
      </div>
    </div>

    <div class="ml-auto flex items-center gap-3">
      <button
        type="button"
        (click)="onCompare()"
        class="rounded-md border border-[color:var(--color-accent)] px-4 py-2 text-sm font-semibold uppercase tracking-wide text-[color:var(--color-accent)] transition hover:bg-[color:var(--color-accent-soft)]"
      >
        Comparar selecionadas
      </button>
      <button
        type="submit"
        class="rounded-md bg-[color:var(--color-accent)] px-5 py-2 text-sm font-semibold uppercase tracking-wide text-black transition hover:opacity-90"
      >
        Apply
      </button>
    </div>
  </div>
</form>

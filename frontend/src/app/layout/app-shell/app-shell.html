<div class="flex min-h-screen flex-col">
  <!-- Top bar -->
  <header class="flex h-14 items-center justify-between border-b border-[color:var(--color-border)] bg-[color:var(--color-bg)] px-6">
    <a routerLink="/hunts" class="text-sm font-bold uppercase tracking-wider text-[color:var(--color-accent)]">
      Tibia Hunt Analyzer
    </a>

    <nav class="flex items-center gap-6 text-sm font-medium">
      <a
        routerLink="/hunts"
        routerLinkActive="text-[color:var(--color-accent)] border-b-2 border-[color:var(--color-accent)]"
        class="border-b-2 border-transparent py-1 text-[color:var(--color-text-secondary)] transition hover:text-[color:var(--color-text-primary)]"
      >
        Hunt History
      </a>
      <a
        routerLink="/compare"
        routerLinkActive="text-[color:var(--color-accent)] border-b-2 border-[color:var(--color-accent)]"
        class="border-b-2 border-transparent py-1 text-[color:var(--color-text-secondary)] transition hover:text-[color:var(--color-text-primary)]"
      >
        Comparisons
      </a>
      <a
        href="#"
        class="border-b-2 border-transparent py-1 text-[color:var(--color-text-secondary)] transition hover:text-[color:var(--color-text-primary)]"
      >
        Party Stats
      </a>
    </nav>

    <div class="flex items-center gap-3">
      <button
        type="button"
        class="rounded-md bg-[color:var(--color-accent)] px-3 py-1.5 text-xs font-semibold uppercase tracking-wide text-black transition hover:opacity-90"
      >
        New Import
      </button>
    </div>
  </header>

  <div class="flex flex-1">
    <!-- Sidebar -->
    <aside class="flex w-56 shrink-0 flex-col border-r border-[color:var(--color-border)] bg-[color:var(--color-bg)] p-4">
      <div class="mb-6 rounded-md border border-[color:var(--color-border)] bg-[color:var(--color-surface)] p-3">
        <p class="text-sm font-semibold text-[color:var(--color-accent)]">Hunt Analytics</p>
        <p class="text-[10px] uppercase tracking-wider text-[color:var(--color-text-muted)]">
          Power User Console
        </p>
      </div>

      <nav class="flex flex-col gap-1 text-sm">
        <a
          href="#"
          class="rounded-md px-3 py-2 text-[color:var(--color-text-secondary)] transition hover:bg-[color:var(--color-surface)]"
        >
          Overview
        </a>
        <a
          routerLink="/hunts"
          routerLinkActive="bg-[color:var(--color-surface)] text-[color:var(--color-accent)]"
          class="rounded-md px-3 py-2 text-[color:var(--color-text-secondary)] transition hover:bg-[color:var(--color-surface)]"
        >
          Combat Logs
        </a>
        <a
          href="#"
          class="rounded-md px-3 py-2 text-[color:var(--color-text-secondary)] transition hover:bg-[color:var(--color-surface)]"
        >
          Team Performance
        </a>
      </nav>

      <div class="mt-auto text-xs text-[color:var(--color-text-muted)]">
        ? Documentation
      </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 px-8 py-6">
      <router-outlet />
    </main>
  </div>

  <!-- Footer -->
  <footer class="flex items-center justify-between border-t border-[color:var(--color-border)] bg-[color:var(--color-bg)] px-6 py-3 text-xs text-[color:var(--color-text-muted)]">
    <span>© 2026 Tibia Hunt Analyzer.</span>
    <div class="flex gap-4">
      <a href="#" class="transition hover:text-[color:var(--color-text-primary)]">Privacy Policy</a>
      <a href="#" class="transition hover:text-[color:var(--color-text-primary)]">Terms of Service</a>
      <a href="#" class="transition hover:text-[color:var(--color-text-primary)]">API Access</a>
    </div>
  </footer>
</div>

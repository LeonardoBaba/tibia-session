<div class="flex min-h-screen flex-col">
  <!-- Top bar -->
  <header class="flex h-14 items-center justify-between border-b border-[color:var(--color-border)] bg-[color:var(--color-bg)] px-6">
    <a routerLink="/hunts" class="text-base font-semibold text-[color:var(--color-accent)]">
      Tibia analyzer
    </a>

    <nav class="flex items-center gap-6 text-sm font-medium">
      <a
        routerLink="/hunts"
        routerLinkActive="text-[color:var(--color-accent)] border-b-2 border-[color:var(--color-accent)]"
        class="border-b-2 border-transparent py-1 text-[color:var(--color-text-secondary)] transition hover:text-[color:var(--color-text-primary)]"
      >
        Hunt History
      </a>
      <a
        routerLink="/compare"
        routerLinkActive="text-[color:var(--color-accent)] border-b-2 border-[color:var(--color-accent)]"
        class="border-b-2 border-transparent py-1 text-[color:var(--color-text-secondary)] transition hover:text-[color:var(--color-text-primary)]"
      >
        Comparisons
      </a>
    </nav>

    <div class="flex items-center gap-3">
      <button
        type="button"
        class="rounded-md bg-[color:var(--color-accent)] px-3 py-1.5 text-xs font-semibold uppercase tracking-wide text-black transition hover:opacity-90"
      >
        New Import
      </button>

      @if (auth.isAuthenticated()) {
        @let user = auth.currentUser()!;
        <div class="relative">
          <button
            type="button"
            (click)="toggleMenu()"
            class="flex items-center gap-2 rounded-full border border-[color:var(--color-border)] bg-[color:var(--color-surface)] py-1 pr-3 pl-1 text-xs transition hover:border-[color:var(--color-border-strong)]"
          >
            @if (user.avatarUrl) {
              <img [src]="user.avatarUrl" alt="" class="h-7 w-7 rounded-full object-cover" />
            } @else {
              <div class="flex h-7 w-7 items-center justify-center rounded-full bg-[color:var(--color-accent)] text-xs font-bold text-black">
                {{ (user.username ?? '?').charAt(0).toUpperCase() }}
              </div>
            }
            <span class="font-medium text-[color:var(--color-text-primary)]">
              {{ user.username ?? user.discordId }}
            </span>
          </button>
          @if (menuOpen()) {
            <div
              class="absolute right-0 mt-2 w-44 rounded-md border border-[color:var(--color-border)] bg-[color:var(--color-surface)] py-1 shadow-lg"
            >
              <button
                type="button"
                (click)="onLogout()"
                class="block w-full px-3 py-2 text-left text-xs text-[color:var(--color-text-secondary)] transition hover:bg-[color:var(--color-surface-2)] hover:text-[color:var(--color-loss)]"
              >
                Sign out
              </button>
            </div>
          }
        </div>
      } @else if (auth.loaded()) {
        <button
          type="button"
          (click)="onLogin()"
          class="rounded-md border border-[color:var(--color-border)] bg-[color:var(--color-surface)] px-3 py-1.5 text-xs font-semibold uppercase tracking-wide text-[color:var(--color-text-secondary)] transition hover:border-[color:var(--color-accent)] hover:text-[color:var(--color-accent)]"
        >
          Login with Discord
        </button>
      }
    </div>
  </header>

  <div class="flex flex-1">
    <!-- Sidebar -->
    <aside class="flex w-56 shrink-0 flex-col border-r border-[color:var(--color-border)] bg-[color:var(--color-bg)] p-4">
      <div class="mb-6 rounded-md border border-[color:var(--color-border)] bg-[color:var(--color-surface)] p-3">
        <p class="text-sm font-semibold text-[color:var(--color-accent)]">Hunt Analytics</p>
      </div>

      <div class="mt-auto text-xs text-[color:var(--color-text-muted)]">
        Documentation
      </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 px-8 py-6">
      <router-outlet />
    </main>
  </div>

  <!-- Footer -->
  <footer class="flex items-center justify-end border-t border-[color:var(--color-border)] bg-[color:var(--color-bg)] px-6 py-3 text-xs text-[color:var(--color-text-muted)]">
    <a href="https://api.huntanalyzer.lbaba.com.br" target="_blank" rel="noopener" class="transition hover:text-[color:var(--color-text-primary)]">
      API Access
    </a>
  </footer>
</div>

version: '3.8'

services:
  # Serviço da sua API (Analyzer)
  app:
    image: ${DOCKER_USERNAME}/analyzer:latest
    container_name: analyzer-app
    restart: always
    ports:
      - "15600:15600"
    environment:
      - ANALYZER_SERVER_PORT=15600
      - ANALYZER_DATABASE_CONNECTION=jdbc:postgresql://db:5432/analyzer
      - ANALYZER_DATABASE_USER=${ANALYZER_DATABASE_USER}
      - ANALYZER_DATABASE_PASSWORD=${ANALYZER_DATABASE_PASSWORD}
      - ANALYZER_DISCORD_TOKEN=${ANALYZER_DISCORD_TOKEN}
    depends_on:
      - db
    networks:
      - analyzer-network

  # Serviço do Banco de Dados (Postgres)
  db:
    image: postgres:16-alpine
    container_name: analyzer-db
    restart: always
    environment:
      POSTGRES_DB: analyzer
      POSTGRES_USER: ${ANALYZER_DATABASE_USER}
      POSTGRES_PASSWORD: ${ANALYZER_DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - analyzer-network

volumes:
  postgres_data:

networks:
  analyzer-network:
    driver: bridge
name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Garante que o mvnw seja executável (evita erro de permissão no Docker)
      - name: Dar permissão de execução ao Maven Wrapper
        run: chmod +x mvnw

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/analyzer:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 1. Prepara a pasta
            mkdir -p /root/analyzer
            cd /root/analyzer
            
            # 2. Cria o arquivo .env com os segredos
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" > .env
            echo "ANALYZER_DATABASE_USER=${{ secrets.DB_USER }}" >> .env
            echo "ANALYZER_DATABASE_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "ANALYZER_DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}" >> .env
            
            # 3. Cria o docker-compose.yml DO ZERO (sobrescreve o antigo/corrompido)
            # O bloco abaixo escreve o conteúdo exato dentro do arquivo na VPS
            cat <<'EOF' > docker-compose.yml
            version: '3.8'

            services:
              app:
                image: ${DOCKER_USERNAME}/analyzer:latest
                container_name: analyzer-app
                restart: always
                ports:
                  - "15600:15600"
                environment:
                  - ANALYZER_SERVER_PORT=15600
                  - ANALYZER_DATABASE_CONNECTION=jdbc:postgresql://db:5432/analyzer
                  - ANALYZER_DATABASE_USER=${ANALYZER_DATABASE_USER}
                  - ANALYZER_DATABASE_PASSWORD=${ANALYZER_DATABASE_PASSWORD}
                  - ANALYZER_DISCORD_TOKEN=${ANALYZER_DISCORD_TOKEN}
                  - ANALYZER_FRONTEND_URL=https://huntanalyzer.lbaba.com.br
                depends_on:
                  - db
                networks:
                  - analyzer-network

              caddy:
                image: caddy:2-alpine
                container_name: analyzer-caddy
                restart: always
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - ./Caddyfile:/etc/caddy/Caddyfile:ro
                  - caddy_data:/data
                  - caddy_config:/config
                depends_on:
                  - app
                networks:
                  - analyzer-network

              db:
                image: postgres:16-alpine
                container_name: analyzer-db
                restart: always
                environment:
                  POSTGRES_DB: analyzer
                  POSTGRES_USER: ${ANALYZER_DATABASE_USER}
                  POSTGRES_PASSWORD: ${ANALYZER_DATABASE_PASSWORD}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                ports:
                  - "5432:5432"
                networks:
                  - analyzer-network

            volumes:
              postgres_data:
              caddy_data:
              caddy_config:

            networks:
              analyzer-network:
                driver: bridge
            EOF

            # 4. Cria o Caddyfile com o reverse proxy + HTTPS automático
            cat <<'EOF' > Caddyfile
            {
                email leobaba111@gmail.com
            }

            api.huntanalyzer.lbaba.com.br {
                encode gzip
                reverse_proxy app:15600
            }
            EOF

            # 5. Atualiza a imagem e reinicia os serviços
            docker compose pull
            docker compose up -d